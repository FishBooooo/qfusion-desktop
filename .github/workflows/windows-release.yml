name: Windows M0 Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "apps/desktop/**"
      - "services/backend/**"
      - "scripts/build_backend.py"
      - "scripts/build_windows.ps1"
      - "scripts/install_tools_windows.ps1"
      - "scripts/qfusion_env.ps1"
      - "scripts/smoke_backend_standalone.py"
      - "scripts/toolchain-versions.json"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned project-local toolchains
        shell: pwsh
        timeout-minutes: 25
        run: ./scripts/build_windows.ps1 -Stage tools

      - name: Sync locked Python dependencies
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/build_windows.ps1 -Stage python-dependencies

      - name: Sync locked Node dependencies and contracts
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/build_windows.ps1 -Stage node-contracts

      - name: Check Rust desktop shell
        shell: pwsh
        timeout-minutes: 30
        run: ./scripts/build_windows.ps1 -Stage rust

      - name: Check Python backend
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/build_windows.ps1 -Stage backend

      - name: Check React frontend
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/build_windows.ps1 -Stage frontend

      # A clean Windows Runner compiles hundreds of Nuitka C translation units.
      - name: Build and smoke-test backend standalone
        shell: pwsh
        timeout-minutes: 90
        run: ./scripts/build_windows.ps1 -Stage backend-package

      - name: Build Tauri NSIS installer
        shell: pwsh
        timeout-minutes: 35
        run: ./scripts/build_windows.ps1 -Stage desktop-package

      - name: Upload backend standalone build
        uses: actions/upload-artifact@v6
        with:
          name: qfusion-backend-windows-m0
          path: dist/backend/**
          if-no-files-found: error

      - name: Upload empty-shell NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: qfusion-desktop-windows-m0
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
