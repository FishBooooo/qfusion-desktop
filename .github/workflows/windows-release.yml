name: Windows M0 Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "apps/desktop/**"
      - "services/backend/**"
      - "scripts/build_backend.py"
      - "scripts/build_windows.ps1"
      - "scripts/install_tools_windows.ps1"
      - "scripts/qfusion_env.ps1"
      - "scripts/smoke_backend_standalone.py"
      - "scripts/toolchain-versions.json"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Build and test with pinned project-local toolchains
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload backend standalone build
        uses: actions/upload-artifact@v6
        with:
          name: qfusion-backend-windows-m0
          path: dist/backend/**
          if-no-files-found: error

      - name: Upload empty-shell NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: qfusion-desktop-windows-m0
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
