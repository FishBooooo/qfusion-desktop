name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve dependency lock without upgrades
        run: |
          ./scripts/install_tools_linux.sh
          cp uv.lock .tmp/uv.lock.before
          ./scripts/run_in_qfusion_env.sh uv lock
          /usr/bin/python3 scripts/check_uv_lock_update.py \
            --before .tmp/uv.lock.before \
            --after uv.lock \
            --allow-new alembic \
            --allow-new greenlet \
            --allow-new mako \
            --allow-new markupsafe \
            --allow-new sqlalchemy
          if ! git diff --quiet -- uv.lock; then
            echo "UV_LOCK_BASE64_BEGIN"
            /usr/bin/base64 --wrap=0 uv.lock
            echo
            echo "UV_LOCK_BASE64_END"
          fi

      - name: Bootstrap pinned project-local toolchains
        run: ./scripts/bootstrap_linux.sh

      - name: Validate workspace and generated contracts
        run: |
          ./scripts/run_in_qfusion_env.sh uv run --locked python scripts/validate_workspace.py --with-tools
          ./scripts/run_in_qfusion_env.sh uv run --locked python scripts/export_openapi.py
          ./scripts/run_in_qfusion_env.sh uv run --locked python scripts/export_domain_schemas.py
          ./scripts/run_in_qfusion_env.sh pnpm generate:client
          git diff --exit-code -- packages/contracts/openapi.json packages/generated-client/src/schema.d.ts schemas/analysis_snapshot.schema.json schemas/data_source_record.schema.json

      - name: Lint and type-check
        run: |
          ./scripts/run_in_qfusion_env.sh uv run --locked ruff check services/backend scripts
          ./scripts/run_in_qfusion_env.sh uv run --locked mypy
          ./scripts/run_in_qfusion_env.sh pnpm --dir apps/desktop lint
          ./scripts/run_in_qfusion_env.sh pnpm --dir apps/desktop typecheck
          ./scripts/run_in_qfusion_env.sh pnpm --filter @qfusion/generated-client typecheck

      - name: Run backend and frontend unit tests
        run: |
          ./scripts/run_in_qfusion_env.sh uv run --locked python -m pytest
          ./scripts/run_in_qfusion_env.sh pnpm --dir apps/desktop test

      - name: Build the frontend
        run: ./scripts/run_in_qfusion_env.sh pnpm --dir apps/desktop build

      - name: Install the project-local Playwright browser
        run: ./scripts/run_in_qfusion_env.sh pnpm --dir apps/desktop exec playwright install chromium

      - name: Run dynamic-loopback E2E
        run: ./scripts/run_in_qfusion_env.sh pnpm --dir apps/desktop test:e2e

      - name: Require the resolved uv lock to be checked in
        run: git diff --exit-code -- uv.lock
