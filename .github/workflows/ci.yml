name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check services/backend scripts
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- packages/contracts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --all-extras
      - run: uv run python scripts/export_openapi.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:client
      - run: git diff --exit-code -- packages/generated-client/src/schema.d.ts
      - run: pnpm --dir apps/desktop lint
      - run: pnpm --dir apps/desktop typecheck
      - run: pnpm --filter @qfusion/generated-client typecheck
      - run: pnpm --dir apps/desktop test
      - run: pnpm --dir apps/desktop build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --all-extras
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - run: pnpm --dir apps/desktop test:e2e

  desktop-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install --yes
          libwebkit2gtk-4.1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
