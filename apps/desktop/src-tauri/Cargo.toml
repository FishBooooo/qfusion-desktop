[package]
name = "qfusion-desktop"
version = "0.1.0"
description = "QFusion Desktop M0 shell"
authors = ["QFusion Desktop contributors"]
edition = "2021"
rust-version = "1.84"

[lib]
name = "qfusion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
